# Publish linux amd64 binaries + control-plane and guest images (pull-only install).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          }
      - name: build
        run: |
          mkdir -p dist
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-egress ./cmd/kin-egress)
          chmod a+x bin/kin-kernel bin/kin-codex-kernel bin/kin-cookie-auth share/wrap-cli/cli-node share/wrap-cli/cc-node share/crag/kin-kernel
          cp bin/kin-kernel bin/kin-codex-kernel bin/kin-cookie-auth share/wrap-cli/cli-node share/wrap-cli/cc-node dist/
          cp share/crag/kin-kernel dist/kin-kernel-crag
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: false
          name: vm2api ${{ github.ref_name }}
          body: |
            仓内预编译 linux amd64 二进制，clone / compose 即可部署，不必在服务器上编 kernel 与 wrap CLI。

            升级见 [CHANGELOG.md](https://github.com/dofastted/vm2api/blob/main/CHANGELOG.md) 与 [docs/DEPLOY.md](https://github.com/dofastted/vm2api/blob/main/docs/DEPLOY.md)。
          files: |
            dist/kin-kernel
            dist/kin-kernel-crag
            dist/kin-codex-kernel
            dist/kin-worker
            dist/kin-egress
            dist/kin-cookie-auth
            dist/cli-node
            dist/cc-node

  images:
    # Control plane + guest OS images so installs never build on the user's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=ghcr.io/${owner}/vm2api:v${version},ghcr.io/${owner}/vm2api:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner}/vm2api:edge" >> "$GITHUB_OUTPUT"
          fi
      - name: control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: guest images
        shell: bash
        run: |
          set -euo pipefail
          owner='${{ steps.meta.outputs.owner }}'
          push() {
            docker build -t "ghcr.io/${owner}/kin-os-$1" docker/kin-os/"$2"
            docker push "ghcr.io/${owner}/kin-os-$1"
          }
          push ubuntu:24.04 ubuntu-24.04
          push debian:12 debian-12
          push arch:latest archlinux
          push fedora:41 fedora-41
