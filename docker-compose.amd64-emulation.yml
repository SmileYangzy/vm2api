# Experimental x86-64 emulation on Linux ARM64.
# Requires a working qemu-x86_64 binfmt handler on the Docker host.
# DOCKER_DEFAULT_PLATFORM is inherited by the slot pull/build/run commands.
services:
  vm2api:
    image: ${VM2API_EMULATION_IMAGE:-ghcr.io/dofastted/vm2api:v1.3.104@sha256:16d35151fcef6030e8d1f1d06bcd745a43482be77ff4299142c8cde126a824a5}
    platform: linux/amd64
    cpus: 2.0
    pids_limit: 512
    environment:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      HOST: ${VM2API_BIND_HOST:-127.0.0.1}
      # Docker memory=0 means unlimited; override older .env values too.
      KIN_VM_MEMORY: "0"
    volumes:
      # Static ARM64 client avoids the amd64 Go netpoll crash under QEMU.
      - ./.local/docker-arm64:/usr/local/bin/docker:ro
      - ./.local/amd64-emulation/vms:/opt/vm2api/vms
      - ./.local/amd64-emulation/data:/opt/vm2api/data
      - ./.local/amd64-emulation/bin:/opt/vm2api/bin
      - ./.local/amd64-emulation/share:/opt/vm2api/share
      - ./.local/amd64-emulation/config:/opt/vm2api/src/config
